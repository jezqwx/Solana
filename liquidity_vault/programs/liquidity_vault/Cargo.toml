[package]
name = "liquidity_vault"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "liquidity_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "raydium-clmm-cpi/idl-build"]


[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.31.1", features = ["token", "associated_token", "mint"] }
raydium-clmm-cpi = { git = "https://github.com/raydium-io/raydium-cpi", rev = "5aeec4b40b09c7f42e28a0f697132b76de872856", features = ["devnet"] }

